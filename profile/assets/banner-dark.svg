<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="SignatureAPI. Integrate electronic signatures. The modern way to collect e-signatures in your apps and workflows, at any scale.">
<style>
  .sig { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 7s ease-in-out infinite; }
  .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp 7s ease-out infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes draw {
    0%, 8% { stroke-dashoffset: 1; opacity: 1; }
    40% { stroke-dashoffset: 0; opacity: 1; }
    88% { stroke-dashoffset: 0; opacity: 1; }
    96%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @keyframes stamp {
    0%, 42% { opacity: 0; transform: scale(1.3); }
    48% { opacity: 1; transform: scale(1); }
    88% { opacity: 1; transform: scale(1); }
    96%, 100% { opacity: 0; transform: scale(1); }
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .sig { animation: none; stroke-dashoffset: 0; }
    .stamp { animation: none; opacity: 1; transform: none; }
    .caret { animation: none; }
  }
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#27272a"/>
  </pattern>
  <radialGradient id="fade" cx="72%" cy="50%" r="60%">
    <stop offset="0" stop-color="#09090b" stop-opacity="0"/>
    <stop offset="1" stop-color="#09090b" stop-opacity="1"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
  </filter>
</defs>

<rect width="1280" height="440" rx="20" fill="#09090b"/>
<rect width="1280" height="440" rx="20" fill="url(#dots)"/>
<rect width="1280" height="440" rx="20" fill="url(#fade)"/>
<rect x="0.5" y="0.5" width="1279" height="439" rx="20" fill="none" stroke="#27272a"/>

<!-- Brand -->
