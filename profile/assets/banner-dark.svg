<!-- Headline -->
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" fill="#fafafa" font-size="60" letter-spacing="-2">
