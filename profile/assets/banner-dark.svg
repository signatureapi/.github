  <tspan x="76" y="266">Electronic Signatures</tspan>
</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#a1a1aa">
  <tspan x="80" y="316">The modern way to collect e-signatures in your</tspan>
  <tspan x="80" y="344">apps and workflows, at any scale.</tspan>
</text>

